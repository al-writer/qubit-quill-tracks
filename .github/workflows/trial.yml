name: Trial (temporary)

# Temporary: tries the studio branch end to end before v1.0.0 exists.
# Removed once the trial has passed. (run 2: steps in bash)
on:
  push:
    branches: [claude/lyric-studio-architecture-f5e9gq]
    paths: [.github/workflows/trial.yml]

jobs:
  prepare:
    uses: al-writer/lyric-motion-studio/.github/workflows/prepare.yml@claude/lyric-studio-architecture-f5e9gq
    with:
      tracks: kara-kargam
      image: ghcr.io/al-writer/lyric-motion-studio/render:claude-lyric-studio-architecture-f5e9gq
    secrets: inherit
    permissions:
      contents: write
      packages: read

  render:
    needs: prepare
    uses: al-writer/lyric-motion-studio/.github/workflows/render.yml@claude/lyric-studio-architecture-f5e9gq
    with:
      track: kara-kargam
      formats: wide+vertical
      res: fhd
      fps: '30'
      quality: draft
      range: 33,37
      shards: '2'
      image: ghcr.io/al-writer/lyric-motion-studio/render:claude-lyric-studio-architecture-f5e9gq
    secrets: inherit
    permissions:
      contents: write
      actions: write
      packages: read
